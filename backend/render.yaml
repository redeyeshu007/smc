services:
  - type: web
    name: smc-ar-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: smc
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_NAME
        value: SMC Admin
      - key: ADMIN_EMAIL
        value: javix@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_PROVIDER
        value: r2
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: smc-3d-assets
      - key: S3_PUBLIC_DOMAIN
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: 50
      - key: MAX_IMAGE_SIZE_MB
        value: 10

